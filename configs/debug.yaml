project:
  name: small-gpt-debug
  seed: 1337

data:
  dataset: null
  language: en

tokenizer:
  type: bpe
  vocab_size: 16384

model:
  n_layer: 2
  n_head: 2
  n_embd: 128
  ffn_hidden: 512
  context_length: 128
  vocab_size: 16384
  dropout: 0.0
  tie_embeddings: true

training:
  device: auto
  precision: fp32
  micro_batch_size: 4
  gradient_accumulation_steps: 1
  max_steps: 200
  learning_rate: 0.0003
  weight_decay: 0.1
  warmup_steps: 20
  gradient_clip: 1.0
  eval_interval: 20
  save_interval: 100