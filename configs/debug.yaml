project:
  name: small-gpt-debug
  seed: 1337

data:
  dataset: null
  language: en

tokenizer:
  type: bpe
  vocab_size: 16384

model:
  architecture: decoder_only_gpt
  n_layer: 2
  n_head: 2
  n_embd: 128
  ffn_hidden: 512
  context_length: 128
  vocab_size: 16384
  dropout: 0.0
  tie_embeddings: true
  normalization: layernorm
  norm_position: pre
  layer_norm_eps: 1.0e-5
  activation: gelu
  gelu_approximate: tanh
  position_encoding: learned_absolute
  linear_bias: false
  lm_head_bias: false
  layer_norm_affine: true
  init_std: 0.02
  scale_residual_projections: true

training:
  device: auto
  precision: fp32
  micro_batch_size: 4
  gradient_accumulation_steps: 1
  max_steps: 200
  learning_rate: 0.0003
  weight_decay: 0.1
  warmup_steps: 20
  gradient_clip: 1.0
  eval_interval: 20
  save_interval: 100
