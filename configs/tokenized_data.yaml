schema_version: 1
format_name: small_gpt_tokenized_corpus

source:
  dataset: HuggingFaceFW/fineweb-edu
  configuration: sample-10BT
  revision: 87f09149ef4734204d70ed1d046ddc9ca3f2b8f9
  corpus_dir: data/processed/fineweb_edu_corpus
  manifest: data/processed/fineweb_edu_corpus/manifest.json
  manifest_sha256: 972c3c3e1733a3535aabb67b3153fc881d0c46f76849a3ff8e522ad18377a8ce
  expected_source_shards: 4
  split_order:
    - train
    - validation
    - test
  file_pattern: "shards/shard-*/{split}.jsonl"
  deterministic_order: source_shard_then_line
  validate_text_sha256: true

tokenizer:
  file: tokenizer/artifacts/tokenizer.json
  sha256: b26835e02eebf777a257c4732abdd6f9732a115967d2ad839f3a1a00e45ee8c5
  metadata: tokenizer/artifacts/tokenizer_config.json
  metadata_sha256: 8622711407aab3f299996b7d3009d4f4447ae35879ca8e50451b5f0adbdf5141
  library:
    name: tokenizers
    version: "0.23.1"
  vocab_size: 16384
  normalizer: nfc
  special_tokens:
    bos:
      token: "<bos>"
      id: 0
    eos:
      token: "<eos>"
      id: 1
    pad:
      token: "<pad>"
      id: 2
    unk:
      token: "<unk>"
      id: 3

encoding:
  append_eos_per_document: true
  add_bos: false
  add_pad: false
  reject_empty_document: true
  allow_cross_document_windows: true
  allow_cross_storage_shard_windows: true
  allow_cross_split_windows: false

binary_format:
  schema_version: 1
  magic: SGPTTOK1
  header_bytes: 64
  struct_format: "<8sHHBBHIB3xQQQIII4x"
  dtype: "<u2"
  dtype_code: 1
  endian: little
  endian_code: 1
  flags:
    append_eos_bit: 0
    add_bos_bit: 1
    add_pad_bit: 2
  split_codes:
    train: 0
    validation: 1
    test: 2

index_format:
  schema_version: 1
  magic: SGPTIDX1
  header_bytes: 128
  header_struct_format: "<8sHHHBBQQQQ32sQI36x"
  record_bytes: 48
  record_struct_format: "<QQ32s"
  offset_dtype: "<u8"
  offset_semantics: shard_local_token_offset
  length_dtype: "<u8"
  length_includes_eos: true
  document_identity: text_sha256_raw_32_bytes

publication:
  manifest_file: manifest.json
  state_file: state.json
  part_suffix: .part
  completed_output_behavior: identity_match_noop
  overwrite_complete_output: false
  atomic_publish: true
  fsync_files: true

profiles:
  pilot:
    output_dir: data/tokenized/fineweb_edu_pilot
    staging_dir: data/tokenized/.fineweb_edu_pilot.inprogress
    target_model_tokens_per_shard: 1000000
    document_atomic: true
    resume_enabled: true

expected:
  train:
    records: 1824
    provided_tokens: 1967041
    raw_bpe_tokens: 2091417
    appended_eos_tokens: 1824
    model_tokens: 2093241
    unknown_tokens: 0
  validation:
    records: 16
    provided_tokens: 12600
    raw_bpe_tokens: 13917
    appended_eos_tokens: 16
    model_tokens: 13933
    unknown_tokens: 0
  test:
    records: 12
    provided_tokens: 20442
    raw_bpe_tokens: 22590
    appended_eos_tokens: 12
    model_tokens: 22602
    unknown_tokens: 0
  totals:
    records: 1852
    provided_tokens: 2000083
    raw_bpe_tokens: 2127924
    appended_eos_tokens: 1852
    model_tokens: 2129776
    unknown_tokens: 0
    token_payload_bytes: 4259552

dataset:
  storage_view: split_logical_stream
  lazy_memmap: true
  output_torch_dtype: long
  train:
    dataset_mode: all_starts
    sampler: epoch_random_window_with_replacement
    base_seed: 42
    shuffle: false
    drop_last_batch: true
  evaluation:
    dataset_mode: sequential_non_overlapping
    start_token: 0
    shuffle: false
    drop_last_batch: false
  dataloader:
    default_num_workers: 0
    windows_validation_num_workers:
      - 0
      - 2
    default_pin_memory: false

fingerprint:
  algorithm: sha256
  canonical_json_sort_keys: true
  exclude_runtime_fields:
    - profiles.pilot.output_dir
    - profiles.pilot.staging_dir
    - cli.resume
    - cli.no_progress
