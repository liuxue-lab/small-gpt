project:
  name: small-gpt-baseline
  seed: 1337

data:
  dataset: null
  language: en
  train_ratio: 0.98
  validation_ratio: 0.01
  test_ratio: 0.01

tokenizer:
  type: bpe
  vocab_size: 16384
  special_tokens:
    - "<bos>"
    - "<eos>"
    - "<pad>"
    - "<unk>"

model:
  architecture: decoder_only_gpt
  n_layer: 8
  n_head: 8
  n_embd: 512
  ffn_hidden: 2048
  context_length: 512
  vocab_size: 16384
  dropout: 0.0
  tie_embeddings: true
  normalization: layernorm
  norm_position: pre
  layer_norm_eps: 1.0e-5
  activation: gelu
  gelu_approximate: tanh
  position_encoding: learned_absolute
  linear_bias: false
  lm_head_bias: false
  layer_norm_affine: true
  init_std: 0.02
  scale_residual_projections: true

training:
  device: cuda
  precision: bf16
  micro_batch_size: null
  gradient_accumulation_steps: null
  max_steps: null
  target_tokens: 300000000
  learning_rate: 0.0003
  min_learning_rate: 0.00003
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  adam_eps: 1.0e-8
  warmup_steps: null
  warmup_ratio: 0.02
  gradient_clip: 1.0
  log_interval: 10
  eval_interval: 500
  eval_batches: 100
  save_interval: 1000
  num_workers: null
  pin_memory: null
  deterministic: false
  allow_tf32: true
  run_dir: runs
  checkpoint_dir: checkpoints
